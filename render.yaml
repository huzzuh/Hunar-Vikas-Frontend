services:
  # Mockup / testing phase: single static site serving
  #   /               -> LandinPage (landing)
  #   /login/         -> login app (sign-in + forgot-password views)
  #   /registration/  -> registration app (new-user sign-up)
  - type: web
    name: hunar-vikas-frontend
    runtime: static
    buildCommand: npm ci --prefix LandinPage && npm run build --prefix LandinPage && npm ci --prefix login && npm run build --prefix login && npm ci --prefix Registration && npm run build --prefix Registration && rm -rf LandinPage/dist/login LandinPage/dist/registration && cp -r login/dist LandinPage/dist/login && cp -r Registration/dist LandinPage/dist/registration
    staticPublishPath: LandinPage/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 22
